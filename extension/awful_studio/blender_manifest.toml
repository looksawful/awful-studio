schema_version = "1.0.0"
id = "awful_studio"
version = "0.0.17"
name = "AWFUL STUDIO"
tagline = "Build an editable virtual product and advertising studio"
maintainer = "Ivan Krushinsky / looksawful"
type = "add-on"
website = "https://github.com/looksawful/awful-studio"
tags = ["Lighting", "Scene"]
blender_version_min = "5.2.0"
blender_version_max = "5.3.0"
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Ivan Krushinsky / looksawful"]

[permissions]
network = "Download a selected optional asset only on explicit request"
files = "Read and write optional assets in the configured cache directory"

[build]
paths_exclude_pattern = ["__pycache__/", ".git/", "*.pyc"]
