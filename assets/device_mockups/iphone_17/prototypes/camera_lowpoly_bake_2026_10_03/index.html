<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone 17 low-poly bake prototype</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c0c0d;color:#eee;font:14px/1.4 system-ui}main{max-width:1400px;margin:auto;padding:32px 24px 100px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}img{width:100%;border:1px solid #333}.card{background:#151517;border:1px solid #333;border-radius:12px;padding:16px}dl{display:grid;grid-template-columns:1fr auto;gap:8px 14px}dd{margin:0}.bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:7px;background:#1a1a1ddd;padding:8px;border:1px solid #444;border-radius:12px}button{background:#29292d;color:#eee;border:1px solid #444;border-radius:7px;padding:8px 11px}button.on{background:#eee;color:#111}@media(max-width:800px){.grid{grid-template-columns:1fr}.bar{width:calc(100% - 20px);overflow:auto}}</style>
<main><h1>iPhone 17 camera: low-poly + baked normals</h1><p>One 192-segment high-poly source. Low-poly delivery candidates: 16 / 24 / 32 / 40.</p><div class="grid"><img id="img"><aside class="card"><h2 id="h"></h2><dl id="m"></dl><p>Khronos: 0 errors / 0 warnings. Judge silhouette first; normal maps cannot repair a polygonal outline.</p></aside></div></main>
<div class="bar"><button data-n="16">16</button><button data-n="24">24</button><button data-n="32">32</button><button data-n="40">40</button><button data-v="baked">baked</button><button data-v="wire">wireframe</button><button data-v="housing-normal">housing normal</button><button data-v="ring-normal">ring normal</button></div>
<script>
let R={},q=new URLSearchParams(location.search),n=q.get('n')||'32',v=q.get('view')||'baked';
fetch('out/metrics.json').then(x=>x.json()).then(x=>{R=x;draw()});
function draw(){document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',b.dataset.n===n));document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));img.src='out/camera_'+n+'_'+v+'.png';h.textContent=n+' radial segments';let x=R[n];m.innerHTML=[['verts',x.verts],['faces',x.faces],['n-gons',x.ngons],['largest face',x.max_face],['evaluated tris',x.runtime_tris],['max silhouette error',x.silhouette_error_mm.toFixed(4)+' mm']].map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('');let u=new URL(location);u.searchParams.set('n',n);u.searchParams.set('view',v);history.replaceState(0,'',u)}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{n=b.dataset.n;draw()});document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{v=b.dataset.v;draw()});
</script>
