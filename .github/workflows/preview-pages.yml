name: Deploy model preview

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'assets/device_mockups/**'
      - 'assets/studio_equipment/**'
      - 'scene_lab/**'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: model-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - name: Install preview dependencies
        working-directory: preview
        run: npm ci
      - name: Test preview contracts
        working-directory: preview
        run: npm test
      - name: Build Storybook
        working-directory: preview
        run: npm run storybook:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Storybook to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
