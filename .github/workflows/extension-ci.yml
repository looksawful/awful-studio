name: Extension QA
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s tests/fast -v
      - run: git diff --check
  runtime:
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install exact official Blender
        shell: bash
        run: |
          python tools/setup_blender.py --destination .blender > blender-path.txt
          echo "BLENDER=$(tail -n 1 blender-path.txt)" >> "$GITHUB_ENV"
      - name: Validate, build and test final ZIP
        shell: bash
        run: python tools/verify_extension.py --blender "$BLENDER"
      - name: Verify native static Extension repository install
        shell: bash
        run: python tools/verify_repository.py --blender "$BLENDER" --package dist/awful_studio-0.0.17.zip --output dist
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.os }}
          path: |
            dist/*.json
            dist/*.log
            .blender/distribution.json
          if-no-files-found: error
      - name: Upload verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-${{ matrix.os }}
          path: dist/awful_studio-0.0.17.zip
          if-no-files-found: error
