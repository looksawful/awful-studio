name: Extension QA
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s tests/fast -v
      - run: git diff --check
  runtime:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Cache pinned Blender runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/blender
            .runtime/blender-5.2.1-linux-x64
          key: awful-blender-${{ runner.os }}-${{ hashFiles('runtime/blender.lock') }}
      - name: Bootstrap exact Blender 5.2.1
        run: python tools/awful.py bootstrap
      - name: Runtime doctor
        run: python tools/awful.py doctor
      - name: Validate, build and test final ZIP
        run: python tools/awful.py verify-extension --output dist
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-linux-x64
          path: |
            dist/*.json
            dist/*.log
            .runtime/bootstrap*.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-linux-x64
          path: dist/awful_studio-0.0.16.zip
          if-no-files-found: error
