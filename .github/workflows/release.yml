name: Publish stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awful-studio-stable-release
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s tests/fast -v
      - run: git diff --check

  candidate:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install exact official Blender
        shell: bash
        run: |
          python tools/setup_blender.py --destination .blender > blender-path.txt
          echo "BLENDER=$(tail -n 1 blender-path.txt)" >> "$GITHUB_ENV"
      - name: Build and verify exact stable ZIP
        shell: bash
        run: python tools/verify_extension.py --blender "$BLENDER"
      - name: Verify native Extension Repository path
        shell: bash
        run: python tools/verify_repository.py --blender "$BLENDER" --package dist/awful_studio-1.0.0.zip --output dist
      - name: Record SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum awful_studio-1.0.0.zip > awful_studio-1.0.0.zip.sha256
      - name: Upload exact release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-release-1.0.0
          path: |
            dist/awful_studio-1.0.0.zip
            dist/awful_studio-1.0.0.zip.sha256
          if-no-files-found: error

  runtime-windows:
    needs: [fast, candidate]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download exact Ubuntu-built release ZIP
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stable-release-1.0.0
          path: dist
      - name: Install exact official Blender
        shell: bash
        run: |
          python tools/setup_blender.py --destination .blender > blender-path.txt
          echo "BLENDER=$(tail -n 1 blender-path.txt)" >> "$GITHUB_ENV"
      - name: Verify exact stable ZIP on Windows
        shell: bash
        run: python tools/verify_extension.py --blender "$BLENDER" --package dist/awful_studio-1.0.0.zip
      - name: Verify native Extension Repository path on Windows
        shell: bash
        run: python tools/verify_repository.py --blender "$BLENDER" --package dist/awful_studio-1.0.0.zip --output dist

  publish:
    needs: [candidate, runtime-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download exact qualified release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stable-release-1.0.0
          path: dist
      - name: Publish GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; refusing to replace an immutable stable release."
            exit 0
          fi
          gh release create v1.0.0 \
            dist/awful_studio-1.0.0.zip \
            dist/awful_studio-1.0.0.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AWFUL STUDIO 1.0.0" \
            --notes-file docs/releases/1.0.0.md
